name: Build HideRail

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq make git curl xz-utils clang dpkg fakeroot zip unzip >/dev/null
          curl -fsSL -o /tmp/ldid https://github.com/ProcursusTeam/ldid/releases/latest/download/ldid_linux_x86_64
          sudo install -m755 /tmp/ldid /usr/local/bin/ldid
          /usr/local/bin/ldid -h 2>&1 | head -3 || true
          clang --version | head -2

      - name: Install Theos + SDKs
        run: |
          export THEOS=$HOME/theos
          git clone --recursive --depth 1 https://github.com/theos/theos.git $THEOS
          git clone --depth 1 https://github.com/theos/sdks.git $THEOS/sdks
          ls $THEOS/sdks | head
          echo "THEOS=$THEOS" >> $GITHUB_ENV

      - name: Build
        run: |
          make clean || true
          make package FINALPACKAGE=1 DEBUG=0 2>&1 | tail -50
          mkdir -p out
          find .theos -name "HideRail.dylib" -exec cp {} out/ \;
          ls -l out

      - uses: actions/upload-artifact@v4
        with:
          name: HideRail-dylib
          path: out/HideRail.dylib
          if-no-files-found: error