name: Build HideRail

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq clang lld llvm ldid curl git zip unzip xz-utils >/dev/null 2>&1 || true
          which clang; clang --version | head -2
          ls /usr/bin | grep -E "^ld64|lld" | head
          which ldid || sudo apt-get install -y -qq ldid || true

      - name: iPhoneOS SDK
        run: |
          git clone --depth 1 https://github.com/theos/sdks.git /tmp/sdks
          SDK=$(ls -d /tmp/sdks/iPhoneOS*.sdk | sort -V | tail -1)
          echo "SDK=$SDK" >> $GITHUB_ENV
          ls "$SDK" | head -5

      - name: Compile dylib
        run: |
          set -e
          clang -target arm64-apple-ios14.0 \
                -dynamiclib -fobjc-arc \
                -isysroot "$SDK" -F"$SDK/System/Library/Frameworks" \
                -framework UIKit -framework Foundation \
                -fuse-ld=lld -Wl,-undefined,dynamic_lookup \
                -Wl,-install_name,/usr/lib/HideRail.dylib \
                -O2 -o HideRail.dylib HideRail.m
          file HideRail.dylib || true
          ls -l HideRail.dylib

      - name: Ad-hoc sign
        run: |
          ldid -S HideRail.dylib && echo signed || echo "ldid unavailable (TrollFools will sign)"
          ls -l HideRail.dylib

      - uses: actions/upload-artifact@v4
        with:
          name: HideRail-dylib
          path: HideRail.dylib
          if-no-files-found: error