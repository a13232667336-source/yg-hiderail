name: Build HideRail

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Install Theos
        run: |
          brew install ldid xz >/dev/null 2>&1 || true
          export THEOS=$HOME/theos
          git clone --recursive --depth 1 https://github.com/theos/theos.git $THEOS
          echo "THEOS=$THEOS" >> $GITHUB_ENV
          echo "$THEOS/bin" >> $GITHUB_PATH

      - name: Build tweak
        run: |
          make clean || true
          make package FINALPACKAGE=1 DEBUG=0

      - name: Collect dylib
        run: |
          mkdir -p out
          find .theos -name "HideRail.dylib" -exec cp {} out/ \;
          ls -l out

      - uses: actions/upload-artifact@v4
        with:
          name: HideRail-dylib
          path: out/HideRail.dylib